<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>影片画廊</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body class="page-wanted">

<header>
  <div class="title-row">
    <h1>影片画廊</h1>
    <span class="source" id="source">加载中…</span>
  </div>
  <nav class="nav-bar">
    <a href="/wanted" id="nav-wanted">最想要列表</a>
    <a href="/library" id="nav-library">本地库</a>
  </nav>

  <!-- /wanted 工具栏：月份筛选 + 搜索 + 抓取 + 刷新 -->
  <div class="toolbar" id="toolbar-wanted" style="display:none">
    <input type="search" id="search" placeholder="搜索车牌或标题…" autocomplete="off">
    <div class="status-filter" id="w-status-filter" role="group" aria-label="按状态筛选">
      <button class="chip-btn active" data-status="" type="button" title="不过滤状态">全部 <span class="count" data-status-count>—</span></button>
      <button class="chip-btn" data-status="downloading" type="button" title="NAS 正在下载">下载中 <span class="count" data-status-count>—</span></button>
      <button class="chip-btn" data-status="downloaded" type="button" title="NAS 已下载，未整理到本地库">已下载 <span class="count" data-status-count>—</span></button>
      <button class="chip-btn" data-status="organized" type="button" title="本地库已收录">已整理 <span class="count" data-status-count>—</span></button>
      <button class="chip-btn" data-status="none" type="button" title="无任何 NAS / 本地库标记">无标记 <span class="count" data-status-count>—</span></button>
    </div>
    <div class="month-picker-wrap">
      <button id="btn-w-month" class="month-trigger" type="button" title="按发行月份筛选">
        <span id="w-month-trigger-label">全部月份</span>
        <span class="caret">▾</span>
      </button>
      <div class="month-popup" id="w-month-popup" hidden role="dialog" aria-label="按月份筛选">
        <div class="month-popup-head">
          <button class="icon-btn" id="w-year-prev" type="button" title="上一年">‹</button>
          <span class="year-display" id="w-year-display">— 年</span>
          <button class="icon-btn" id="w-year-next" type="button" title="下一年">›</button>
        </div>
        <div class="month-grid" id="w-month-grid"></div>
        <div class="month-popup-foot">
          <button class="chip-btn" id="w-month-unknown" type="button">未知月份 <span class="count">0</span></button>
          <button class="chip-btn" id="w-month-clear" type="button">清除筛选</button>
        </div>
      </div>
    </div>
    <button id="btn-all">全选</button>
    <button id="btn-none">清空</button>
    <button id="btn-invert">反选</button>
    <span class="spacer"></span>
    <span class="count">已选 <b id="sel-count">0</b> / <span id="total">0</span></span>
    <span id="last-refresh" class="last-refresh"></span>
    <button id="btn-refresh" title="抓取 Most Wanted → 合并 → 逐条抓 JavBus 详情">🔄 手动刷新</button>
    <button id="btn-export">导出 code</button>
    <button id="btn-scrape" class="primary">抓取选中的磁力</button>
    <button id="btn-nsfw-w" class="nsfw-toggle" type="button" aria-pressed="false" title="关闭时海报模糊显示（默认）">
      <span class="nsfw-icon" aria-hidden="true">🔞</span>
      <span class="nsfw-label">NSFW 隐藏</span>
    </button>
  </div>

  <!-- /library 工具栏 -->
  <div class="toolbar" id="toolbar-library" style="display:none">
    <input type="search" id="lib-search" placeholder="搜索车牌 / 标题 / 演员…" autocomplete="off">
    <select id="lib-sort" style="padding:7px 11px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:inherit;">
      <option value="released" selected>按发售时间</option>
      <option value="carid">按车牌</option>
      <option value="mtime">按修改时间</option>
    </select>
    <div class="month-picker-wrap">
      <button id="btn-month" class="month-trigger" type="button" title="按发行月份筛选">
        <span id="month-trigger-label">全部月份</span>
        <span class="caret">▾</span>
      </button>
      <div class="month-popup" id="month-popup" hidden role="dialog" aria-label="按月份筛选">
        <div class="month-popup-head">
          <button class="icon-btn" id="year-prev" type="button" title="上一年">‹</button>
          <span class="year-display" id="year-display">— 年</span>
          <button class="icon-btn" id="year-next" type="button" title="下一年">›</button>
        </div>
        <div class="month-grid" id="month-grid"></div>
        <div class="month-popup-foot">
          <button class="chip-btn" id="month-unknown" type="button">未知月份 <span class="count">0</span></button>
          <button class="chip-btn" id="month-clear" type="button">清除筛选</button>
        </div>
      </div>
    </div>
    <button id="btn-lib-rescan">刷新库</button>
    <button id="btn-lib-backfill" title="扫描全库 + 检查缺失 + 从 JAVBus 补齐 NFO / 封面 / 样图（不触碰已有文件）">补齐缺失</button>
    <button id="btn-lib-backfill-cancel" style="display:none" title="发取消信号，正在跑的后台线程在当前部处理完后退出">停止补齐</button>
    <span class="spacer"></span>
    <span class="count" id="lib-status">—</span>
    <button id="btn-nsfw-l" class="nsfw-toggle" type="button" aria-pressed="false" title="关闭时海报模糊显示（默认）">
      <span class="nsfw-icon" aria-hidden="true">🔞</span>
      <span class="nsfw-label">NSFW 隐藏</span>
    </button>
  </div>

  <!-- /library 当前筛选（演员等，可点 × 清除） -->
  <div class="active-filters" id="active-filters" style="display:none"></div>

  <div id="banner" hidden></div>
</header>

<main id="grid"></main>

<aside id="panel">
  <div class="panel-head">
    <h2>磁力抓取</h2>
    <button class="icon-btn" id="btn-close" title="收起">×</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-text">
      <span id="prog-label">准备中…</span>
      <span id="prog-count">0 / 0</span>
    </div>
    <div class="bar"><i id="prog-bar"></i></div>
  </div>
  <div class="panel-body">
    <div id="results"></div>
    <details class="logs">
      <summary>抓取日志</summary>
      <pre class="log" id="log"></pre>
    </details>
  </div>
  <div class="panel-foot">
    <button id="btn-copy-all">复制全部磁力</button>
    <button id="btn-send-zspace" disabled title="极空间未配置">📥 发送到NAS</button>
    <button id="btn-retry" disabled>重试失败项</button>
    <div class="outputs" id="outputs"></div>
  </div>
</aside>

<div id="tooltip" hidden></div>
<div id="lightbox" hidden role="dialog" aria-label="查看大图"><img id="lightbox-img" alt=""><div class="lb-caption" id="lightbox-cap"></div></div>
<div id="gallery-lb" hidden role="dialog" aria-label="查看大图与样图">
  <div class="glb-header">
    <span id="glb-title">—</span>
    <button type="button" class="glb-close" id="glb-close">关闭 ✕</button>
  </div>
  <div class="glb-main">
    <button type="button" class="glb-nav prev" id="glb-prev" aria-label="上一张">‹</button>
    <img id="glb-img" alt="">
    <button type="button" class="glb-nav next" id="glb-next" aria-label="下一张">›</button>
  </div>
  <div class="glb-thumbs" id="glb-thumbs"></div>
</div>

<!-- zspace 配置已迁到 .env：ZSPACE_ENABLED / ZSPACE_HOST / ZSPACE_USER / ZSPACE_PASSWORD -->
<!-- / ZSPACE_DEVICE_ID / ZSPACE_DOWNLOAD_PATH。改完需重启服务。 -->

<div id="toast"></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
