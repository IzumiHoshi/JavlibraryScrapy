[project]
name = "javlibraryscrapy"
version = "0.1.0"
description = "jav info scrapy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pillow>=11.2.1",
    "poetry>=2.1.3",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "scrapling[all]>=0.4.8",
    "starlette>=1.0.0",
    "uvicorn>=0.30.0",
]

[[tool.uv.index]]
# Optional name for the index. 这个可以不写
name = "aliyun"
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "torch-cpu-nju"
url = "https://mirror.nju.edu.cn/pytorch/whl/cpu/"
explicit = true

[tool.uv.sources]
torch = [{ index = "torch-cpu-nju" }]
