[project]
name = "javlibraryscrapy"
version = "0.1.0"
description = "jav info scrapy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",   # 极空间 NAS RSA 登录加密（vendored zspace_nas/auth.py）
    "fastapi>=0.115.0",
    "httpx>=0.27.0",          # 极空间 NAS async HTTP 客户端（vendored zspace_nas/client.py）
    "pillow>=11.2.1",
    "poetry>=2.1.3",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "scrapling[all]>=0.4.8",
    "starlette>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
# 启动画廊 FastAPI 服务（等价于旧的 `python -m scripts.gallery.main`）
javlibraryscrapy-gallery = "javlibraryscrapy.cli.gallery:main"
# 把 Most Wanted 列表导出到本地库
javlibraryscrapy-export = "javlibraryscrapy.cli.export_mostwanted:main"
# 全流程：下载目录 → 中间 → 最终（削刮）
javlibraryscrapy-workflow = "javlibraryscrapy.cli.workflow:main"
# 把视频文件按大小过滤后移动
javlibraryscrapy-move = "javlibraryscrapy.cli.move_videos:main"
# 去除文件名中 @ 符号之前的内容
javlibraryscrapy-rename = "javlibraryscrapy.cli.rename_at_symbol:main"
# 补齐本地库缺失的 NFO / 封面 / 样图
javlibraryscrapy-backfill = "javlibraryscrapy.cli.backfill:main"
# 扫描本地影片库（不暴露 CLI 入口，仅 `python -m` 调用）

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/javlibraryscrapy"]

# Dev 依赖（PEP 735）。`uv sync --group dev` 装；uv run pytest 默认也会带上。
# httpx 已在主依赖里，无需重复。
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# pytest-asyncio 配置：async def test_* 无需 @pytest.mark.asyncio 装饰器。
# tests/unit/test_scraper.py 等历史测试就是这种写法。
[tool.pytest.ini_options]
asyncio_mode = "auto"

[[tool.uv.index]]
# Optional name for the index. 这个可以不写
name = "aliyun"
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "torch-cpu-nju"
url = "https://mirror.nju.edu.cn/pytorch/cpu/"
explicit = true

[tool.uv.sources]
torch = [{ index = "torch-cpu-nju" }]